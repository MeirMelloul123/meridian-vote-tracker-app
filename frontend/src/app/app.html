<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Meridian Vote Tracker</h1>

    <select class="form-select form-select-sm" style="width: auto" (change)="onUserChange($event)">
      @for (u of users(); track u.id) {
      <option [value]="u.id">{{ u.name }} · {{ u.role }}</option>
      }
    </select>
  </div>
  <nav class="mb-3">
    <a routerLink="/imports" class="btn btn-outline-primary btn-sm me-2">Imports</a>
    <a routerLink="/conflicts" class="btn btn-outline-primary btn-sm">Conflicts</a>
  </nav>
  <router-outlet />
</div>
