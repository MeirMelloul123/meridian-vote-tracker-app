<h2>Conflicts</h2>

<p class="text-muted">{{ message() }}</p>

<table class="table table-striped table-bordered">
    <thead class="table-light">
        <tr>
            <th>Vote</th>
            <th>Country</th>
            <th>Approved value</th>
            <th>Incoming value</th>
            <th>Comment</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        @for (conflict of conflicts(); track conflict.id) {
        <tr>
            <td>{{ conflict.vote?.assemblyVoteId }}</td>
            <td>{{ conflict.countryCode }}</td>
            <td>{{ conflict.currentValue }}</td>
            <td>{{ conflict.proposedValue }}</td>
            <td>
                <input #comment class="form-control form-control-sm" type="text" />
            </td>
            <td>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-success"
                        (click)="decide(conflict, true, comment.value)">Accept</button>
                    <button class="btn btn-sm btn-outline-danger"
                        (click)="decide(conflict, false, comment.value)">Reject</button>
                </div>
            </td>
        </tr>
        }
    </tbody>
</table>
