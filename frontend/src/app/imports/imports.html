<h2>Imports</h2>

<table class="table table-striped table-bordered">
    <thead class="table-light">
        <tr>
            <th>File</th>
            <th>Uploaded by</th>
            <th>Uploaded at</th>
            <th>Status</th>
            <th>Progress</th>
        </tr>
    </thead>
    <tbody>
        @for (imp of imports(); track imp.id) {
        <tr>
            <td>{{ imp.fileName }}</td>
            <td>{{ imp.uploadedBy }}</td>
            <td>{{ imp.uploadedAt | date:'short' }}</td>
            <td>{{ imp.status }}</td>
            <td>{{ imp.processedRows }} / {{ imp.totalRows }}</td>
        </tr>
        }
    </tbody>
</table>
<input class="form-control form-control-sm mb-2" style="max-width: 400px" type="file" accept=".csv"
    (change)="onFileSelected($event)" />
<p class="text-muted">{{ message() }}</p>
