services:
  db:
    image: postgres:16
    container_name: meridian-db
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian_dev
    ports:
      - "5433:5432"
    volumes:
      - meridian-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Meridian.Api/Dockerfile
    container_name: meridian-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=meridian;Username=meridian;Password=meridian_dev"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  meridian-db-data: